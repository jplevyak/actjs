# Valkey configuration for actjs production.
#
# This is the minimum config needed to honor the durability target
# captured in tasks/phase-2-storage-layer.adr.md:
#
#   * AOF appendfsync = everysec   (at most 1s of writes lost on crash)
#   * RDB snapshot every 1 h or 10k writes (cold-restart artifact)
#
# Operators override per environment; these defaults are what the
# storage layer assumes.

# ----- Persistence ---------------------------------------------------

appendonly yes
appendfsync everysec

# Rewrite AOF when it doubles in size beyond 64 MB.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB checkpoints. Per default, Valkey rolls one if any of these match.
save 3600 1
save 1800 100
save 300 10000

# ----- Memory --------------------------------------------------------

# Leave maxmemory unset by default; actor traffic is bounded by the
# active-actor cap (Phase 7.2) not by Valkey size. Operators set this
# explicitly when running constrained hardware.

# ----- Network -------------------------------------------------------

# Compose binds to 0.0.0.0 by default. Production deployments place
# Valkey on a private network and set protected-mode yes.

protected-mode yes
